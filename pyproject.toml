[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "claude-context-compiler"
version = "0.5.5"
description = "Local context compiler for AI coding assistants — smallest correct context bundle with rationale"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "sumesh", email = "" },
]
keywords = ["mcp", "claude", "context", "llm", "code-intelligence", "tree-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "kuzu>=0.7",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.0",
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "click>=8.0",
]

[project.urls]
Repository = "https://github.com/bytewise-ca/context-compiler"

[project.optional-dependencies]
semantic = [
    "fastembed>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "datamodel-code-generator>=0.25",
]

[project.scripts]
context-compiler = "context_compiler.cli:cli"
claude-context-compiler = "context_compiler.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/context_compiler"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = ["tests/fixtures"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
